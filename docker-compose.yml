services:
  postgres:
    image: postgres:15-alpine
    container_name: omnisched_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: omnisched_platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d omnisched_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omnisched-network
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: omnisched_cache
    restart: unless-stopped
    networks:
      - omnisched-network
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  prometheus:
    image: prom/prometheus:latest
    container_name: omnisched_metrics
    restart: unless-stopped
    volumes:
      - ./src/infra/config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:${PROMETHEUS_PORT:-9090}"
    networks:
      - omnisched-network

  grafana:
    image: grafana/grafana:latest
    container_name: omnisched_dashboard
    restart: unless-stopped
    depends_on:
      - prometheus
      - postgres
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    ports:
      - "${GRAFANA_PORT:-3000}:${GRAFANA_PORT:-3000}"
    networks:
      - omnisched-network
    volumes:
      - grafana_data:/var/lib/grafana
  loki:
      image: grafana/loki:latest
      ports:
        - "3100:3100"
      command: -config.file=/etc/loki/local-config.yaml
      networks:
      - omnisched-network
  promtail:
    image: grafana/promtail:latest
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./src/infra/config/promtail.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - omnisched-network
    depends_on:
      - loki

networks:
  omnisched-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data: