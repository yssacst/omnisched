services:
  postgres:
    image: postgres:15-alpine
    container_name: omnisched_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: omnisched_platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d omnisched_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omnisched-network
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: omnisched_cache
    restart: unless-stopped
    networks:
      - omnisched-network
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  prometheus:
    image: prom/prometheus:latest
    container_name: omnisched_metrics
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - omnisched-network

  grafana:
    image: grafana/grafana:latest
    container_name: omnisched_dashboard
    restart: unless-stopped
    depends_on:
      - prometheus
      - postgres
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    ports:
      - "3000:3000"
    networks:
      - omnisched-network
    volumes:
      - grafana_data:/var/lib/grafana

networks:
  omnisched-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data: